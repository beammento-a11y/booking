<style>
body{background:var(--soft)}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--muted);position:relative;z-index:1}

/* auth */
.authwrap{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:#fff}
.authcard{width:100%;max-width:430px;padding:30px 28px}
.alogo{text-align:center;margin-bottom:18px}
.alogo small{display:block;margin-top:10px;font-weight:700;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;font-size:11px}
.authcard h2{font-size:21px;margin-bottom:4px}
.authcard .sub{color:var(--muted);font-size:13.5px;margin-bottom:18px}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin:2px 0 14px;cursor:pointer}
.notice{background:#fff4e5;border:1px solid #f3d29b;color:#7a4e00;padding:10px 12px;border-radius:10px;font-size:13px;margin-bottom:14px}
.infobox{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--muted);margin-bottom:14px}

/* shell */
#app{position:relative;z-index:1;display:grid;grid-template-columns:252px 1fr;min-height:100vh}
.side{background:var(--navy);color:#cfd8e6;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:60}
.side-top{padding:22px 20px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.side-top .mb-logo{color:#fff}
.side-top img{height:24px;width:auto;display:block}
.alogo-img{height:44px;width:auto;display:inline-block}
.side-top small{display:block;margin-top:9px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#7f93b0;font-weight:700}
#nav{flex:1;overflow-y:auto;padding:12px}
#nav a{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:11px;color:#cfd8e6;text-decoration:none;font-weight:600;font-size:14px;margin-bottom:3px}
#nav a:hover{background:rgba(255,255,255,.07)}
#nav a.on{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff}
.side-foot{padding:14px;border-top:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;gap:7px}
.side-foot button{background:rgba(255,255,255,.07);border:none;color:#e5ecf6;padding:9px 12px;border-radius:9px;font-size:13px;font-weight:600;text-align:left}
.side-foot button:hover{background:rgba(255,255,255,.14)}
#meBox{padding:2px 4px 6px;font-size:13px;color:#fff}
#meBox small{display:block;color:#8ea3c0;font-size:11.5px}
.main{min-width:0}
.top{display:flex;align-items:center;gap:12px;padding:16px 24px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
.top h1{font-size:20px;flex:1}
.burger{display:none;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:18px}
.side-shade{display:none}
#view{padding:22px 24px 80px;max-width:1200px}
@media(max-width:900px){
  #app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .25s;width:262px}
  .side.open{transform:none}
  .side-shade.open{display:block;position:fixed;inset:0;background:rgba(6,24,47,.5);z-index:55}
  .burger{display:block}
  #view{padding:16px 14px 80px}.top{padding:12px 14px}
}

.box{padding:20px;margin-bottom:18px}
.box h3{font-size:16px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:18px}
.stat{padding:16px 18px;display:flex;align-items:center;gap:14px}
.stat i{font-style:normal;width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:22px;background:rgba(26,86,176,.1)}
.stat b{display:block;font-family:Montserrat;font-size:25px;color:var(--navy);line-height:1.1}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab{padding:8px 15px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:13px;color:var(--muted)}
.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.drow{display:flex;align-items:center;gap:14px;padding:12px;border:1px solid var(--line);border-radius:13px;margin-bottom:9px;cursor:pointer;background:#fff;transition:border-color .15s,box-shadow .15s}
.drow:hover{border-color:var(--blue2);box-shadow:0 6px 18px rgba(6,24,47,.07)}
.dblk{flex-shrink:0;width:54px;border-radius:11px;overflow:hidden;text-align:center;border:1px solid var(--line)}
.dblk i{display:block;font-style:normal;background:var(--red);color:#fff;font-size:10px;font-weight:800;padding:2px 0;letter-spacing:.08em}
.dblk b{display:block;font-family:Montserrat;font-size:21px;color:var(--navy);padding:3px 0 4px;line-height:1.1}
.drow .di{flex:1;min-width:0}
.drow .di h4{font-size:14.5px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drow .di p{font-size:12.5px;color:var(--muted)}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.banner{padding:12px 16px;border-radius:12px;font-weight:600;font-size:13.5px;margin-bottom:16px;display:flex;gap:10px;align-items:center}
.banner.warn{background:#fff4e5;border:1px solid #f3d29b;color:#7a4e00}
.banner.crit{background:#fdecee;border:1px solid #f1a5ae;color:#8a0016}
.chip{padding:5px 11px;border-radius:999px;font-size:12px;font-weight:800;background:#eef1f6;color:var(--muted)}
.chip.warn{background:#fff4e5;color:#a86f00}.chip.crit{background:#fdecee;color:var(--red)}

/* tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:9px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:hover td{background:#fafbfd}
.acts{display:flex;gap:6px;justify-content:flex-end}
.slotbox{border:1px solid var(--line);border-radius:13px;margin-bottom:12px;overflow:hidden}
.sbh{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--soft);padding:10px 14px;font-size:13.5px;flex-wrap:wrap}
.sbh span{color:var(--muted);font-weight:600;font-size:12.5px}
.slotbox .tw{padding:0 6px}
.fr{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.fr .field{margin-bottom:0;min-width:180px}
.fr .grow{flex:1}

/* calendar */
.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.cal-head h3{font-size:19px;flex:1;min-width:150px;margin:0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dow{text-align:center;font-size:11.5px;font-weight:800;color:var(--muted);text-transform:uppercase;padding:4px 0}
.cell{min-height:86px;border:1px solid var(--line);border-radius:11px;background:#fff;padding:7px;text-align:left;display:flex;flex-direction:column;gap:4px;transition:border-color .15s,transform .1s}
.cell:hover{border-color:var(--blue2);transform:translateY(-1px)}
.cell.blank{visibility:hidden}
.cell.past{background:#f6f7f9;color:#9aa6b8}
.cell.today{border:2px solid var(--red)}
.cell .cn{font-weight:800;font-size:13px}
.cp{font-size:10.5px;font-weight:800;padding:2px 6px;border-radius:6px;line-height:1.3;display:block}
.cp.s-open,.cp.s-today{background:rgba(18,161,80,.14);color:var(--ok)}
.cp.s-full{background:rgba(230,154,0,.16);color:#a86f00}
.cp.s-closed{background:rgba(192,0,26,.1);color:var(--red)}
.cp.s-completed,.cp.s-empty{background:#e9edf3;color:var(--muted)}
@media(max-width:700px){.cell{min-height:62px;padding:4px}.cp{font-size:9px;padding:1px 3px}.cal-grid{gap:3px}}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px;font-size:12px;color:var(--muted)}

/* attendance */
.att-btns{display:flex;gap:5px}
.ab{padding:5px 10px;border-radius:8px;border:1.5px solid var(--line);background:#fff;font-size:12px;font-weight:800;color:var(--muted)}
.ab.p.on{background:var(--ok);border-color:var(--ok);color:#fff}
.ab.a.on{background:var(--red);border-color:var(--red);color:#fff}
.ab:hover{border-color:var(--blue2)}

/* storage */
.sbar{height:18px;border-radius:9px;background:#e9edf3;overflow:hidden}
.sbar i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#5fcf8a);border-radius:9px;transition:width .5s}
.sbar i.warn{background:linear-gradient(90deg,var(--warn),#f5c35a)}
.sbar i.crit{background:linear-gradient(90deg,var(--red),var(--red2))}
.parts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:16px}
.part{background:var(--soft);border-radius:11px;padding:10px 13px}
.part b{display:block;font-size:15px}.part span{font-size:12px;color:var(--muted)}

/* content */
.gthumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:12px}
.gt{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.gt img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.gt div{padding:7px;display:flex;gap:6px}
.gt input{padding:6px 8px;font-size:12px}
.perms{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 12px}
@media(max-width:520px){.perms{grid-template-columns:1fr}}
.perms label{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:600;padding:8px 10px;border:1px solid var(--line);border-radius:10px;text-transform:none;letter-spacing:0;color:var(--text);margin:0;cursor:pointer}
.pnl h2.mh{padding-right:36px}
.pt{display:flex;gap:6px;flex-wrap:wrap}
</style>
</head>
<body>

<div id="boot" class="center"><div class="spin dark" style="width:28px;height:28px"></div><span>Loading admin panel…</span></div>

<div id="authWrap" class="authwrap" hidden><div class="card authcard" id="authCard"></div></div>

<div id="app" hidden>
  <aside class="side" id="side">
    <div class="side-top"><span id="sideLogo"></span><small>Admin Panel</small></div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div id="meBox"></div>
      <button data-act="pwd">🔑 Change password</button>
      <button data-act="logout">⎋ Sign out</button>
    </div>
  </aside>
  <div class="side-shade" id="shade" data-act="closeSide"></div>
  <div class="main">
    <header class="top">
      <button class="burger" data-act="openSide" aria-label="Menu">☰</button>
      <h1 id="pageTitle">Dashboard</h1>
      <span id="topChip"></span>
    </header>
    <div id="view"></div>
  </div>
</div>

<script>
injectDeco();
$('#sideLogo').innerHTML = '<img src="nav-logo.png" alt="MentoBeam"/>';

/* ====================== constants & state ====================== */
const PERMS = {
  dates: 'Exam dates & time slots',
  bookings: 'Registrations (view / edit / delete)',
  attendance: 'Attendance page',
  reports: 'Reports & PDF',
  content: 'Website content & photos',
  storage: 'Storage & monthly cleanup'
};
const ALLPERMS = Object.fromEntries(Object.keys(PERMS).map(k => [k, true]));
const NAV = [
  { id: 'dashboard', icon: '📊', label: 'Dashboard' },
  { id: 'calendar', icon: '🗓️', label: 'Exam Dates', perm: 'dates' },
  { id: 'registrations', icon: '👥', label: 'Registrations', perm: 'bookings' },
  { id: 'attendance', icon: '✅', label: 'Attendance', perm: 'attendance' },
  { id: 'reports', icon: '📄', label: 'Reports', perm: 'reports' },
  { id: 'content', icon: '🖼️', label: 'Website Content', perm: 'content' },
  { id: 'storage', icon: '💾', label: 'Storage', perm: 'storage' },
  { id: 'sheet', icon: '📗', label: 'Google Sheet', perm: '__super' },
  { id: 'admins', icon: '🔐', label: 'Admins', perm: '__super' }
];
const view = $('#view');
let me = null, user = null, dates = [], slots = [], bookings = [], unsubs = [];
let current = 'dashboard', activePanel = null, storageInfo = null;
let setupReady = Promise.resolve(), settingUp = false, setupDone = false, authNotice = '', started = false;

const can = p => !!me && (me.role === 'super' || (me.perms && me.perms[p] === true));
const slotsOf = id => slots.filter(s => s.dateId === id).sort((a, b) => a.time.localeCompare(b.time));
const regsOfSlot = id => bookings.filter(b => b.slotId === id);
const regsOfDate = id => bookings.filter(b => b.dateId === id);
async function run(btn, fn) {
  const old = btn ? btn.innerHTML : null;
  if (btn) btn.disabled = true;
  try { return await fn(); } catch (e) { toast(errMsg(e), 'err'); }
  finally { if (btn && btn.isConnected) { btn.disabled = false; if (old != null) btn.innerHTML = old; } }
}
function authErr(e) {
  const c = e && e.code;
  if (['auth/wrong-password', 'auth/invalid-credential', 'auth/invalid-login-credentials', 'auth/user-not-found'].includes(c)) return 'Email or password is incorrect.';
  if (c === 'auth/too-many-requests') return 'Too many attempts. Please wait a few minutes and try again.';
  if (c === 'auth/email-already-in-use') return 'This email already has an account.';
  if (c === 'auth/weak-password') return 'Password is too weak (minimum 6 characters).';
  if (c === 'auth/invalid-email') return 'Invalid email address.';
  if (c === 'auth/network-request-failed') return 'Network error. Check your internet.';
  if (c === 'auth/operation-not-allowed') return 'Email/Password sign-in is not enabled in Firebase Authentication.';
  return errMsg(e);
}
function fmtBytes(b) {
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
  if (b < 1073741824) return (b / 1048576).toFixed(1) + ' MB';
  return (b / 1073741824).toFixed(2) + ' GB';
}
function dBlock(ds) {
  const d = parseD(ds);
  return `<div class="dblk"><i>${d.toLocaleDateString('en-GB', { month: 'short' }).toUpperCase()}</i><b>${d.getDate()}</b></div>`;
}
function attBadge(v) { return v === true ? '<span class="badge b-ok">Present</span>' : v === false ? '<span class="badge b-red">Absent</span>' : '<span class="badge b-gray">Not marked</span>'; }

/* ====================== AUTH ====================== */
async function boot() {
  if (!CONFIGURED) {
    $('#boot').innerHTML = '<div style="max-width:420px;text-align:center;padding:20px"><h2>Firebase config missing</h2><p style="margin-top:8px">common.js file එකේ <b>firebaseConfig</b> එක paste කරන්න. (README.md බලන්න)</p></div>';
    return;
  }
  /* the 'is setup done' check and the login/session restore now run at the SAME time (before: one after the other) */
  setupReady = db.collection('meta').doc('setup').get().then(s => { setupDone = s.exists; });
  setupReady.catch(e => { $('#boot').innerHTML = '<div style="max-width:440px;text-align:center;padding:20px"><h2>Cannot reach the database</h2><p style="margin-top:8px">' + esc(errMsg(e)) + '</p><p class="help">Firestore database create කරලා rules publish කළාද බලන්න.</p></div>'; });
  auth.onAuthStateChanged(onAuth);
}
async function onAuth(u) {
  if (settingUp) return;
  if (!u) { stopApp(); try { await setupReady; } catch (e) { return; } showAuth(setupDone ? 'login' : 'setup'); return; }
  if (started && user && user.uid === u.uid) return;
  try {
    const snap = await db.collection('admins').doc(u.uid).get();
    if (!snap.exists) { authNotice = 'This account does not have admin access.'; await auth.signOut(); return; }
    user = u; me = { id: u.uid, ...snap.data() }; startApp();
  } catch (e) { authNotice = errMsg(e); await auth.signOut(); }
}
function showAuth(mode) {
  $('#boot').hidden = true; $('#app').hidden = true; $('#authWrap').hidden = false;
  const card = $('#authCard'); const note = authNotice; authNotice = '';
  const head = `<div class="alogo"><img class="alogo-img" src="nav-logo.png" alt="MentoBeam"/><small>Admin Panel</small></div>${note ? `<div class="notice">${esc(note)}</div>` : ''}`;
  if (mode === 'setup') {
    card.innerHTML = head + `<h2>First-time setup</h2><p class="sub">Create the <b>Super Admin</b> account. You will be able to add more admins and give them permissions later.</p>
    <form id="setupForm" autocomplete="on">
      <div class="field"><label>Your name</label><input id="suName" required autocomplete="name"/></div>
      <div class="field"><label>Email</label><input id="suEmail" type="email" required autocomplete="username"/></div>
      <div class="field"><label>Password (min 6)</label><input id="suPw" type="password" required minlength="6" autocomplete="new-password"/></div>
      <div class="field"><label>Confirm password</label><input id="suPw2" type="password" required autocomplete="new-password"/></div>
      <div class="field"><label>Master delete password</label><input id="suMp" type="password" required minlength="4" autocomplete="off"/>
        <div class="help">This is needed later to delete the first (founder) Super Admin. Keep it safe.</div></div>
      <div class="err" id="authErr"></div>
      <button class="btn btn-primary btn-block btn-lg" id="suBtn">Create Super Admin</button>
    </form>`;
    $('#setupForm').onsubmit = e => { e.preventDefault(); doSetup(); };
  } else if (mode === 'reset') {
    card.innerHTML = head + `<h2>Reset password</h2><p class="sub">We will email you a reset link.</p>
    <form id="resetForm"><div class="field"><label>Email</label><input id="rsEmail" type="email" required/></div>
    <div class="err" id="authErr"></div><button class="btn btn-blue btn-block" id="rsBtn">Send reset link</button>
    <p style="text-align:center;margin-top:14px"><a href="#" id="backLogin">← Back to sign in</a></p></form>`;
    $('#backLogin').onclick = e => { e.preventDefault(); showAuth('login'); };
    $('#resetForm').onsubmit = async e => {
      e.preventDefault(); const b = $('#rsBtn'); b.disabled = true;
      try { await auth.sendPasswordResetEmail($('#rsEmail').value.trim()); $('#authErr').style.color = 'var(--ok)'; $('#authErr').textContent = 'Reset link sent. Check your email.'; }
      catch (er) { $('#authErr').style.color = ''; $('#authErr').textContent = authErr(er); }
      b.disabled = false;
    };
  } else {
    card.innerHTML = head + `<h2>Sign in</h2><p class="sub">Authorised staff only.</p>
    <form id="loginForm" autocomplete="on">
      <div class="field"><label>Email</label><input id="liEmail" name="email" type="email" required autocomplete="username"/></div>
      <div class="field"><label>Password</label><input id="liPw" name="password" type="password" required autocomplete="current-password"/></div>
      <label class="chk"><input type="checkbox" id="liKeep" checked/> Keep me signed in on this device (auto login)</label>
      <div class="err" id="authErr"></div>
      <button class="btn btn-primary btn-block btn-lg" id="liBtn">Sign in</button>
      <p style="text-align:center;margin-top:14px;font-size:13px"><a href="#" id="forgot">Forgot password?</a></p>
    </form>`;
    $('#forgot').onclick = e => { e.preventDefault(); showAuth('reset'); };
    $('#loginForm').onsubmit = async e => {
      e.preventDefault(); const b = $('#liBtn'); b.disabled = true; b.innerHTML = '<span class="spin"></span>';
      try {
        await auth.setPersistence($('#liKeep').checked ? firebase.auth.Auth.Persistence.LOCAL : firebase.auth.Auth.Persistence.SESSION);
        await auth.signInWithEmailAndPassword($('#liEmail').value.trim(), $('#liPw').value);

// keep the database small: exam dates/slots/registrations, mock-test slots/requests, and rental bookings
// from more than 30 days ago are removed automatically (same idea as the error-log auto-delete).
// This never touches the Google Sheet – the sheet keeps whatever was last synced, and a deleted record
// is never sent to it again (nothing here calls sheetQueue / sheetSend).
async function bookingPrune() {
  if (!can('storage')) return;
  try {
    const cutoff = addDays(todayStr(), -30);
    const [oldDates, oldSlots, oldBookings, oldMockSlots, oldMockBookings, oldRent] = await Promise.all([
      db.collection('examDates').where('date', '<', cutoff).limit(300).get(),
      db.collection('slots').where('date', '<', cutoff).limit(300).get(),
      db.collection('bookings').where('date', '<', cutoff).limit(300).get(),
      db.collection('mockSlots').where('date', '<', cutoff).limit(300).get(),
      db.collection('mockBookings').where('date', '<', cutoff).limit(300).get(),
      db.collection('rentBookings').where('date', '<', cutoff).limit(300).get()
    ]);
    const ops = [
      ...oldBookings.docs.map(d => ({ t: 'del', ref: d.ref })),
      ...oldSlots.docs.map(d => ({ t: 'del', ref: d.ref })),
      ...oldDates.docs.map(d => ({ t: 'del', ref: d.ref })),
      ...oldMockBookings.docs.map(d => ({ t: 'del', ref: d.ref })),
      ...oldMockSlots.docs.map(d => ({ t: 'del', ref: d.ref })),
      ...oldRent.docs.reduce((acc, d) => acc.concat([
        { t: 'del', ref: d.ref },
        { t: 'del', ref: db.collection('rentSlips').doc(d.id) },
        { t: 'del', ref: db.collection('rentSlips').doc(d.id + '_bal') }
      ]), [])
    ];
    if (ops.length) await commitOps(ops);
  } catch (e) { /* best-effort background cleanup – never interrupts the admin */ }
}
/* ---------- WEEKLY REPEAT (only for exam dates where the admin pressed "Repeat every week") ----------
   Each repeating date keeps the next 8 weeks of exam days ready (same weekday, same time slots, seats reset to 0).
   Every exam day is its own date, so each day keeps its own registrations, attendance and report, and becomes "Completed" by itself. */
const REPEAT_WEEKS = 8;
let _repLoad = 0, _repDone = false, _repBusy = false;
const addDays = (ds, n) => { const [y, m, d] = ds.split('-').map(Number); return dstr(new Date(y, m - 1, d + n)); };
function repeatKick() { if (_repDone || _repLoad !== 3) return; _repDone = true; setTimeout(() => repeatTopUp(true), 1200); }
async function repeatTopUp(quiet) {
  if (_repBusy || !me || !can('dates')) return 0;
  _repBusy = true; let made = 0;
  try {
    const today = todayStr(), horizon = addDays(today, REPEAT_WEEKS * 7);
    const groups = {};
    dates.filter(d => d.repeatWeekly === true).forEach(d => { (groups[d.seriesId || d.id] = groups[d.seriesId || d.id] || []).push(d); });
    for (const sid of Object.keys(groups)) {
      const mem = groups[sid].sort((a, b) => a.date.localeCompare(b.date));
      const last = mem[mem.length - 1];
      const tpl = mem.slice().reverse().find(m => slotsOf(m.id).length);          // newest day that has time slots = the pattern to copy
      if (!tpl) continue;
      const tsl = slotsOf(tpl.id);
      let t = addDays(last.date, 7);
      while (t < today) t = addDays(t, 7);                                          // never create days in the past
      for (; t <= horizon; t = addDays(t, 7)) {
        if (dates.some(x => x.date === t)) continue;                                // an exam already exists that day
        const did = sid + '_' + t, dref = db.collection('examDates').doc(did);
        const ok = await db.runTransaction(async tx => {
          if ((await tx.get(dref)).exists) return false;                            // safe if two admins open the panel together
          tx.set(dref, { date: t, title: tpl.title || 'PTE Simulation Exam', notes: tpl.notes || '', closed: false, createdAt: Date.now(), repeatWeekly: true, seriesId: sid });
          tsl.forEach((sl, i) => tx.set(db.collection('slots').doc(did + '_' + i), { dateId: did, date: t, time: sl.time, endTime: sl.endTime || null, capacity: sl.capacity == null ? null : sl.capacity, booked: 0, createdAt: Date.now() }));
          return true;
        });
        if (ok) { made++; sheetQueue({ dates: [did] }); }
      }
    }
    if (made) toast('🔁 ' + made + ' weekly exam date' + (made > 1 ? 's' : '') + ' created automatically', 'ok');
  } catch (e) { if (!quiet) toast(errMsg(e), 'err'); console.warn('weekly repeat', e); }
  finally { _repBusy = false; }
  return made;
}
// when the admin turns "repeat every week" off, let them choose whether to remove the upcoming
// auto-created dates (that have no registrations) now, or keep every date and remove any by hand later
function chooseRepeatOff(removableCount, keepCount) {
  return new Promise(res => {

    const m = modal(`<h2 class="mh">Turn off weekly repeat</h2>

        : 'All the dates in this series already have registrations or have already happened, so none can be removed automatically. You can still delete any of them one by one from the calendar.'}</p>
      <div style="display:flex;flex-direction:column;gap:10px;margin-top:14px">

        <button class="btn btn-blue" id="roKeep">Keep all dates – just turn repeat off</button>

const getLimit = () => (Number(localStorage.getItem('mb_limit_mb')) || 1024) * 1048576;
async function computeStorage() {
  if (!started) return;
  const sz = (id, o) => JSON.stringify(o).length + String(id).length + 32;
  const parts = { 'Exam dates': 0, 'Time slots': 0, 'Bookings': 0, 'Rentals': 0, 'Error log': 0, 'Photos': 0, 'Settings': 0, 'Admins': 0 };
  dates.forEach(({ id, ...r }) => parts['Exam dates'] += sz(id, r));
  slots.forEach(({ id, ...r }) => parts['Time slots'] += sz(id, r));
  bookings.forEach(({ id, ...r }) => parts['Bookings'] += sz(id, r));
  try { rentBookings.forEach(({ id, ...r }) => parts['Rentals'] += sz(id, r)); rentSpaces.forEach(({ id, ...r }) => parts['Rentals'] += sz(id, r)); } catch (e) { /* rentals module not loaded */ }
  try { errLogs.forEach(({ id, ...r }) => parts['Error log'] += sz(id, r)); } catch (e) { /* ignore */ }
  /* gallery + settings + admins are read at the same time (before: one after the other) */
  const [g, s, a] = await Promise.all([db.collection('gallery').get().catch(() => null), db.collection('settings').get().catch(() => null), db.collection('admins').get().catch(() => null)]);
  if (g) g.forEach(d => parts['Photos'] += sz(d.id, d.data()));
  if (s) s.forEach(d => parts['Settings'] += sz(d.id, d.data()));
  if (a) a.forEach(d => parts['Admins'] += sz(d.id, d.data())); else parts['Admins'] = 800;
  const used = Object.values(parts).reduce((a, b) => a + b, 0);
  storageInfo = { parts, used, limit: getLimit(), at: Date.now() };
  updateChip();
  if (current === 'storage' || current === 'dashboard') views[current].refresh && views[current].refresh();
}
function storagePct() { return storageInfo ? storageInfo.used / storageInfo.limit : 0; }
function updateChip() {
  const el = $('#topChip'); if (!storageInfo) { el.innerHTML = ''; return; }
  const p = storagePct(), cls = p >= .95 ? 'crit' : p >= .8 ? 'warn' : '';
  el.innerHTML = `<span class="chip ${cls}">💾 ${(p * 100).toFixed(p < .1 ? 1 : 0)}% used</span>`;
}
function storageBanner() {
  const p = storagePct(); if (!storageInfo || p < .8) return '';
  return p >= .95
    ? `<div class="banner crit">🚨 Storage almost FULL (${(p * 100).toFixed(0)}%). Delete old months now in the Storage page, otherwise new bookings may fail.</div>`
    : `<div class="banner warn">⚠️ Storage is ${(p * 100).toFixed(0)}% full. Please delete old months soon (Storage page).</div>`;
}

let repMonth = todayStr().slice(0, 7);
function buildReport(month) {
  const ds = dates.filter(d => d.date.startsWith(month)).sort((a, b) => a.date.localeCompare(b.date));
  const rows = ds.map(d => {
    const items = slotsOf(d.id).map(s => {
      const regs = regsOfSlot(s.id).sort((a, b) => a.name.localeCompare(b.name));
      const att = regs.filter(b => b.attended === true).length, abs = regs.filter(b => b.attended === false).length;
      return { s, regs, att, abs, nm: regs.length - att - abs };
    });
    const sum = k => items.reduce((a, i) => a + i[k], 0);
    const caps = items.map(i => i.s.capacity);
    return { d, items, reg: items.reduce((a, i) => a + i.regs.length, 0), att: sum('att'), abs: sum('abs'), nm: sum('nm'),
      cap: items.length && caps.every(c => c != null) ? caps.reduce((a, b) => a + b, 0) : null };
  });
  const t = { dates: rows.length, slots: rows.reduce((a, r) => a + r.items.length, 0), reg: 0, att: 0, abs: 0, nm: 0 };
  rows.forEach(r => { t.reg += r.reg; t.att += r.att; t.abs += r.abs; t.nm += r.nm; });
  t.rate = t.att + t.abs ? Math.round(t.att / (t.att + t.abs) * 100) : null;
  return { month, rows, t };
}

function compressToDataUrl(file, maxPx = 1000) {
  return new Promise((res, rej) => {
    const fr = new FileReader(); fr.onerror = rej;
    fr.onload = () => {
      const img = new Image(); img.onerror = rej;
      img.onload = () => {
        let { width: w, height: h } = img; const r = Math.min(1, maxPx / Math.max(w, h));
        w = Math.round(w * r); h = Math.round(h * r);
        const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h);
        let q = .8, out = c.toDataURL('image/jpeg', q);
        while (out.length > 260000 && q > .4) { q -= .1; out = c.toDataURL('image/jpeg', q); }
        res(out);
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
async function uploadPhotos(files) {
  const arr = Array.from(files || []).filter(f => f.type.startsWith('image/'));
  if (!arr.length) return;
  if (galDocs.length + arr.length > 12) { toast('Maximum 12 photos allowed', 'err'); return; }
  toast('Compressing & uploading…');
  try {
    for (const f of arr) {
      const data = await compressToDataUrl(f);
      const ref = await db.collection('gallery').add({ data, caption: '', order: Date.now(), size: data.length });
      galDocs.push({ id: ref.id, data, caption: '', order: Date.now() });
    }
    toast('Photos uploaded', 'ok'); views.content.paint(); computeStorage();
  } catch (e) { toast(errMsg(e), 'err'); }
}

async function createAuthUser(email, pw) {
  const app = firebase.initializeApp(firebaseConfig, 'sec' + Date.now());
  try {
    const a = app.auth();
    try { return (await a.createUserWithEmailAndPassword(email, pw)).user.uid; }
    catch (e) {
      if (e.code === 'auth/email-already-in-use') {
        try { return (await a.signInWithEmailAndPassword(email, pw)).user.uid; }
        catch (e2) { throw new Error('This email already has an account with a different password. Use the same password or another email.'); }
      }
      throw e;
    }
  } finally { try { await app.auth().signOut(); } catch (_) { /* ignore */ } await app.delete(); }
}

/* ====================== GOOGLE SHEET SYNC ====================== */
const GAS_CODE = "/**\n * MentoBeam \u2013 Exam + Rental bookings -> Google Sheet auto-sync\n *\n * HOW TO USE (also shown inside Admin Panel -> Google Sheet):\n *  1. Create a BLANK Google Sheet.\n *  2. Extensions -> Apps Script -> delete everything -> paste this whole file -> Save.\n *  3. Deploy -> New deployment -> type \"Web app\"\n *       Execute as: Me      |   Who has access: Anyone\n *     -> Deploy -> Authorize -> copy the Web app URL (ends with /exec).\n *  4. Paste that URL in Admin Panel -> Google Sheet -> Save & Connect.\n *\n * ALL exam registrations are saved in ONE tab (\"Exam Bookings\"), one row per registration, with the\n * exam date in a column (no separate tab for every exam date). A month can be deleted from the sheet:\n * reload the Google Sheet -> menu \"MentoBeam\" -> \"Delete exam records of a month...\".\n *\n * The script never trusts the data it receives. The website only sends booking /\n * exam-date IDs; this script reads the real record from Firestore and writes it\n * to the sheet. The website never deletes anything from the sheet\n * (cancelled bookings are only marked \"Cancelled\"), so clearing old data from\n * the database never clears the sheet. Only YOU delete a month, from the menu above.\n */\n\nvar FIREBASE_PROJECT_ID = '__PROJECT_ID__';\nvar FIREBASE_API_KEY = '__API_KEY__';   // public web key of your Firebase app (same one as in common.js)\nvar TIMEZONE = 'Asia/Colombo';\nvar OVERVIEW_TAB = 'Overview';\nvar MAIN_TAB = 'Exam Bookings';\n\nvar HEAD = 3;          // header row\nvar FIRST = 4;         // first data row\nvar MAXROWS = 3000;\nvar HEADERS = ['No', 'Name', 'Email', 'Phone', 'Exam Date', 'Start Time', 'End Time', 'Attendance', 'Status', 'Registered At', 'Booking Code', 'Exam', 'Exam ID'];\nvar NC = HEADERS.length;\nvar COL_DATE = 5, COL_START = 6, COL_ATT = 8, COL_STATUS = 9, COL_REG = 10, COL_CODE = 11, COL_TITLE = 12, COL_DID = 13;\nvar NAVY = '#06182f', BLUE = '#0b3d91', RED = '#c0001a';\n\n/* ============================ entry points ============================ */\nfunction doGet() {\n  return out_({ ok: true, service: 'MentoBeam sheet sync', time: new Date().toISOString() });\n}\n\nfunction doPost(e) {\n  var lock = LockService.getScriptLock();\n  try {\n    lock.waitLock(30000);\n    var p = JSON.parse((e && e.postData && e.postData.contents) || '{}');\n    var ss = SpreadsheetApp.getActiveSpreadsheet();\n    switch (p.action) {\n      case 'ping':  return out_({ ok: true, name: ss.getName(), url: ss.getUrl() });\n      case 'setup': return out_(setup_(ss));\n      case 'index': return out_(index_(ss));\n      case 'sync':  return out_(sync_(ss, p));\n      case 'rent':  return out_(rent_(ss, p));\n      case 'rentSpaces': return out_(rentSpaces_(ss, p));\n      case 'rentIndex':  return out_(rentIndex_(ss));\n      default:      return out_({ ok: false, error: 'Unknown action' });\n    }\n  } catch (err) {\n    return out_({ ok: false, code: (err && err.code) || 'E_SCRIPT', detail: (err && err.detail) || '', error: String((err && err.message) || err) });\n  } finally {\n    try { lock.releaseLock(); } catch (x) { /* not locked */ }\n  }\n}\n\nfunction out_(o) {\n  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);\n}\n\n/* ============================ setup / index ============================ */\nfunction setup_(ss) {\n  ss.setSpreadsheetTimeZone(TIMEZONE);\n  if (!ss.getSheetByName(OVERVIEW_TAB)) {\n    var sheets = ss.getSheets();\n    if (sheets.length === 1 && sheets[0].getLastRow() === 0) sheets[0].setName(OVERVIEW_TAB);\n    else ss.insertSheet(OVERVIEW_TAB, 0);\n  }\n  mainSheet_(ss);\n  rebuildOverview_(ss);\n  return { ok: true, name: ss.getName(), url: ss.getUrl() };\n}\n\n// which booking codes already exist in the sheet (used by the admin panel to auto-fill gaps) + the months you deleted (those are not filled again)\nfunction index_(ss) {\n  var sh = mainSheet_(ss), codes = [], dateIds = {}, last = sh.getLastRow();\n  if (last >= FIRST) {\n    sh.getRange(FIRST, COL_CODE, last - FIRST + 1, 3).getValues().forEach(function (r) {\n      if (r[0]) codes.push(String(r[0]));\n      if (r[2]) dateIds[String(r[2])] = 1;\n    });\n  }\n  return { ok: true, codes: codes, dateIds: Object.keys(dateIds), deletedMonths: deleted_() };\n}\n\n/* ============================ main sync ============================ */\nvar DATE_RE = /^\\d{4}-\\d{2}-\\d{2}$/;\n\nfunction sync_(ss, p) {\n  var res = { ok: true, dates: 0, added: 0, updated: 0, moved: 0, cancelled: 0, skipped: 0 };\n  if (ss.getSpreadsheetTimeZone() !== TIMEZONE) ss.setSpreadsheetTimeZone(TIMEZONE);\n\n  var dIds = uniq_(p.dateIds), bIds = uniq_(p.bookingIds), tok = String(p.token || '');\n  var recB = (p.records && p.records.bookings) || {}, recD = (p.records && p.records.dates) || {}, gone = uniq_(p.gone);\n  var bDocs;\n  try { bDocs = fetchDocs_('bookings', bIds, tok); }\n  catch (e) {\n    // Firestore refused the direct read -> use the data sent from the website page instead\n    bDocs = payloadBookings_(bIds, recB, gone);\n    var any = false; bIds.forEach(function (id) { if (bDocs[id] !== undefined) any = true; });\n    if (bIds.length && !any) throw e;\n    res.warn = e.code;\n  }\n\n  // exam dates we need: the ones asked for + the ones the bookings belong to\n  var need = dIds.slice();\n  bIds.forEach(function (id) {\n    var b = bDocs[id];\n    if (b && b.dateId && need.indexOf(b.dateId) < 0) need.push(b.dateId);\n  });\n  var dDocs = {}, warn = '', warnErr = null;\n  try { dDocs = fetchDocs_('examDates', need, tok); }\n  catch (e) {   // not fatal: use the date sent by the page, or what the booking itself carries (date + exam title)\n    warn = e.code || 'E_READ_EXAMDATES'; warnErr = e;\n    need.forEach(function (id) { if (recD[id]) dDocs[id] = { date: String(recD[id].date || ''), title: String(recD[id].title || '') }; });\n  }\n  if (warn && dIds.length && !need.some(function (id) { return dDocs[id]; })) throw warnErr;\n  if (warn) res.warn = warn;\n\n  var sh = mainSheet_(ss), dirty = false, n = Math.max(sh.getLastRow() - HEAD, 0);\n  var blk = n ? sh.getRange(FIRST, COL_DATE, n, COL_DID - COL_DATE + 1).getValues() : [];   // date .. exam id\n  var codeRow = {}, DC = COL_CODE - COL_DATE, TC = COL_TITLE - COL_DATE, IC = COL_DID - COL_DATE;\n  blk.forEach(function (r, i) { if (r[DC]) codeRow[String(r[DC])] = i; });\n\n  // an exam date was created / changed -> its rows follow the date and the title\n  dIds.forEach(function (id) {\n    var d = dDocs[id]; if (!d || !DATE_RE.test(String(d.date))) return;\n    res.dates++;\n    var title = d.title || 'PTE Simulation Exam';\n    blk.forEach(function (r, i) {\n      if (String(r[IC]) !== id) return;\n      if (dstr_(r[0]) !== d.date) { sh.getRange(FIRST + i, COL_DATE).setValue(dateObj_(d.date)); r[0] = dateObj_(d.date); dirty = true; }\n      if (String(r[TC]) !== title) { sh.getRange(FIRST + i, COL_TITLE).setValue(title); r[TC] = title; dirty = true; }\n    });\n  });\n\n  var del = deleted_(), adds = [];\n  bIds.forEach(function (id) {\n    var b = bDocs[id], i = codeRow[id];\n    if (b === undefined) return;                                   // invalid id\n    if (b === null) {                                              // booking no longer exists -> keep row, mark cancelled\n      if (i !== undefined) { sh.getRange(FIRST + i, COL_STATUS).setValue('Cancelled'); res.cancelled++; }\n      return;\n    }\n    if (!DATE_RE.test(String(b.date))) return;\n    var d = dDocs[b.dateId], title = (d && d.title) || b.examTitle || 'PTE Simulation Exam';\n    var vals = rowVals_(id, b, title);\n    if (i !== undefined) {\n      if (dstr_(blk[i][0]) !== b.date) dirty = true;               // moved to another exam date\n      sh.getRange(FIRST + i, 1, 1, NC).setValues([vals]); res.updated++;\n    } else {\n      var mo = String(b.date).slice(0, 7);\n      if (del[mo] && (Number(b.createdAt) || 0) <= del[mo]) { res.skipped++; return; }   // this month was deleted from the sheet on purpose\n      adds.push(vals); res.added++; dirty = true;\n    }\n  });\n\n  if (adds.length) {\n    var last = Math.max(sh.getLastRow(), HEAD);\n    if (last + adds.length > sh.getMaxRows()) { sh.insertRowsAfter(sh.getMaxRows(), last + adds.length - sh.getMaxRows() + 1000); formatMain_(sh); }\n    sh.getRange(last + 1, 1, adds.length, NC).setValues(adds);\n  }\n  if (adds.length || res.updated || dirty) finalize_(sh);\n  if (dirty) rebuildOverview_(ss);\n  return res;\n}\n\n/* ============================ Firestore (read-only REST) ============================ */\n// bookings sent by the page (only used when Firestore refuses the script's own read)\nfunction payloadBookings_(ids, rec, gone) {\n  var out = {};\n  ids.forEach(function (id) {\n    if (gone.indexOf(id) >= 0) { out[id] = null; return; }\n    var r = rec[id];\n    if (!r) return;\n    out[id] = {\n      name: String(r.name || ''), email: String(r.email || ''), phone: String(r.phone || ''),\n      dateId: String(r.dateId || ''), date: String(r.date || ''), time: String(r.time || ''),\n      endTime: r.endTime ? String(r.endTime) : null, createdAt: Number(r.createdAt) || 0,\n      attended: r.attended === true ? true : r.attended === false ? false : null, examTitle: String(r.examTitle || '')\n    };\n  });\n  return out;\n}\n\nfunction coded_(code, msg, detail) { var e = new Error(msg); e.code = code; e.detail = detail || ''; return e; }\n\n// reads documents from Firestore. With an admin token it reads as that admin, otherwise as a public visitor\nfunction fetchDocs_(coll, ids, token) {\n  var out = {};\n  var base = 'https://firestore.googleapis.com/v1/projects/' + FIREBASE_PROJECT_ID + '/databases/(default)/documents/' + coll + '/';\n  var list = ids.filter(function (id) { return /^[A-Za-z0-9_-]{4,64}$/.test(id); });\n  for (var i = 0; i < list.length; i += 30) {\n    var chunk = list.slice(i, i + 30);\n    var rs = UrlFetchApp.fetchAll(chunk.map(function (id) {\n      var q = { url: base + id + (FIREBASE_API_KEY && FIREBASE_API_KEY.indexOf('__') !== 0 ? '?key=' + encodeURIComponent(FIREBASE_API_KEY) : ''), muteHttpExceptions: true };\n      if (token) q.headers = { Authorization: 'Bearer ' + token };\n      return q;\n    }));\n    rs.forEach(function (r, k) {\n      var c = r.getResponseCode();\n      if (c === 200) out[chunk[k]] = docToObj_(JSON.parse(r.getContentText()));\n      else if (c === 404) out[chunk[k]] = null;\n      else {\n        var why = '';\n        try { var j = JSON.parse(r.getContentText()); why = (j.error && (j.error.status + ': ' + j.error.message)) || ''; } catch (x) { why = String(r.getContentText()).slice(0, 200); }\n        throw coded_('E_READ_' + coll.toUpperCase() + '_' + c, 'Could not read ' + coll + ' (HTTP ' + c + ')', why.slice(0, 300));\n      }\n    });\n  }\n  return out;\n}\n\nfunction val_(v) {\n  if (!v) return null;\n  if ('stringValue' in v) return v.stringValue;\n  if ('integerValue' in v) return Number(v.integerValue);\n  if ('doubleValue' in v) return v.doubleValue;\n  if ('booleanValue' in v) return v.booleanValue;\n  if ('timestampValue' in v) return v.timestampValue;\n  if ('arrayValue' in v) return (v.arrayValue.values || []).map(val_);\n  if ('mapValue' in v) { var o = {}, f = v.mapValue.fields || {}; Object.keys(f).forEach(function (k) { o[k] = val_(f[k]); }); return o; }\n  return null;\n}\nfunction docToObj_(d) {\n  var o = {}, f = (d && d.fields) || {};\n  Object.keys(f).forEach(function (k) { o[k] = val_(f[k]); });\n  return o;\n}\n\n/* ============================ sheet helpers ============================ */\nfunction uniq_(a) {\n  var seen = {}, out = [];\n  (a || []).forEach(function (x) { x = String(x); if (x && !seen[x]) { seen[x] = 1; out.push(x); } });\n  return out;\n}\n\nfunction dateSheets_(ss) {\n  var out = [];\n  ss.createDeveloperMetadataFinder().withKey('dateId').find().forEach(function (m) {\n    var loc = m.getLocation();\n    if (loc.getLocationType() === SpreadsheetApp.DeveloperMetadataLocationType.SHEET) out.push({ sh: loc.getSheet(), id: m.getValue() });\n  });\n  return out;\n}\nfunction getMeta_(sh, key) {\n  var m = sh.createDeveloperMetadataFinder().withKey(key).find();\n  return m.length ? m[0].getValue() : null;\n}\nfunction setMeta_(sh, key, val) {\n  var m = sh.createDeveloperMetadataFinder().withKey(key).find();\n  if (m.length) m[0].setValue(val); else sh.addDeveloperMetadata(key, val);\n}\n\nfunction dateObj_(s) { return Utilities.parseDate(s + ' 12:00:00', TIMEZONE, 'yyyy-MM-dd HH:mm:ss'); }\nfunction longDate_(s) { return Utilities.formatDate(dateObj_(s), TIMEZONE, 'EEEE, dd MMM yyyy'); }\nfunction dstr_(v) { return v instanceof Date ? Utilities.formatDate(v, TIMEZONE, 'yyyy-MM-dd') : String(v || ''); }\nfunction frac_(t) { if (!t) return ''; var a = String(t).split(':'); return (Number(a[0]) * 60 + Number(a[1] || 0)) / 1440; }\nfunction attLabel_(v) { return v === true ? 'Present' : v === false ? 'Absent' : 'Not marked'; }\nfunction uniqueName_(ss, base, self) {\n  var name = base, n = 2;\n  for (;;) {\n    var ex = ss.getSheetByName(name);\n    if (!ex || (self && ex.getSheetId() === self.getSheetId())) return name;\n    name = base + ' (' + n++ + ')';\n  }\n}\n\nfunction rowVals_(id, b, title) {\n  return ['', b.name || '', b.email || '', String(b.phone || ''), dateObj_(b.date), frac_(b.time), frac_(b.endTime),\n    attLabel_(b.attended), 'Booked', new Date(Number(b.createdAt) || Date.now()), id, title || '', String(b.dateId || '')];\n}\n\n// sort by exam date, then start time, then registration time, and renumber\nfunction finalize_(sh) {\n  var n = sh.getLastRow() - HEAD;\n  if (n < 1) return;\n  sh.getRange(FIRST, 1, n, NC).sort([{ column: COL_DATE, ascending: true }, { column: COL_START, ascending: true }, { column: COL_REG, ascending: true }]);\n  var nums = [];\n  for (var i = 1; i <= n; i++) nums.push([i]);\n  sh.getRange(FIRST, 1, n, 1).setValues(nums);\n}\n\n/* ============================ the ONE exam tab ============================ */\nfunction mainSheet_(ss) {\n  var sh = null;\n  ss.createDeveloperMetadataFinder().withKey('examAll').find().forEach(function (m) {\n    var loc = m.getLocation();\n    if (!sh && loc.getLocationType() === SpreadsheetApp.DeveloperMetadataLocationType.SHEET) sh = loc.getSheet();\n  });\n  if (!sh) sh = ss.getSheetByName(MAIN_TAB);\n  if (!sh) { sh = ss.insertSheet(MAIN_TAB, ss.getSheetByName(OVERVIEW_TAB) ? 1 : ss.getSheets().length); formatMain_(sh); }\n  if (getMeta_(sh, 'examAll') === null) sh.addDeveloperMetadata('examAll', '1');\n  migrateOld_(ss, sh);\n  return sh;\n}\n\n// older versions of this script made one tab per exam date -> copy their rows into the one tab, then remove those tabs\n// (a tab is only removed when every one of its registrations is safely in the main tab)\nfunction migrateOld_(ss, main) {\n  var old = dateSheets_(ss).filter(function (x) { return x.sh.getSheetId() !== main.getSheetId(); });\n  if (!old.length) return 0;\n  var have = {}, lastM = main.getLastRow();\n  if (lastM >= FIRST) main.getRange(FIRST, COL_CODE, lastM - FIRST + 1, 1).getValues().forEach(function (r) { if (r[0]) have[String(r[0])] = 1; });\n  var rows = [], removable = [];\n  old.forEach(function (x) {\n    var last = x.sh.getLastRow(), title = getMeta_(x.sh, 'title') || 'PTE Simulation Exam', ok = true;\n    if (last >= FIRST) {\n      x.sh.getRange(FIRST, 1, last - FIRST + 1, 11).getValues().forEach(function (r) {\n        var code = String(r[COL_CODE - 1] || '');\n        if (!r[1] && !code) return;                       // empty row\n        if (!code) { ok = false; return; }                // a row without a booking code (typed by hand) -> keep this tab\n        if (have[code]) return;\n        have[code] = 1; rows.push(r.slice(0, 11).concat([title, String(x.id)]));\n      });\n    }\n    if (ok) removable.push(x.sh);\n  });\n  if (rows.length) {\n    var last2 = Math.max(main.getLastRow(), HEAD);\n    if (last2 + rows.length > main.getMaxRows()) { main.insertRowsAfter(main.getMaxRows(), last2 + rows.length - main.getMaxRows() + 1000); formatMain_(main); }\n    main.getRange(last2 + 1, 1, rows.length, NC).setValues(rows);\n    finalize_(main);\n  }\n  removable.forEach(function (sh) { try { ss.deleteSheet(sh); } catch (e) { /* keep it */ } });\n  rebuildOverview_(ss);\n  return rows.length;\n}\n\n/* ============================ auto format ============================ */\nfunction formatMain_(sh) {\n  if (sh.getMaxColumns() > NC) sh.deleteColumns(NC + 1, sh.getMaxColumns() - NC);\n  if (sh.getMaxColumns() < NC) sh.insertColumnsAfter(sh.getMaxColumns(), NC - sh.getMaxColumns());\n  if (sh.getMaxRows() < MAXROWS) sh.insertRowsAfter(sh.getMaxRows(), MAXROWS - sh.getMaxRows());\n  var f = sh.getFilter(); if (f) f.remove();\n  sh.setHiddenGridlines(true);\n  sh.setFrozenRows(HEAD);\n\n  // title banner\n  sh.getRange(1, 1, 1, NC).merge().setBackground(NAVY).setFontColor('#ffffff').setFontSize(15).setFontWeight('bold')\n    .setHorizontalAlignment('left').setVerticalAlignment('middle');\n  sh.getRange(1, 1).setValue('MentoBeam \\u2013 Simulation Exam registrations (all exam dates)');\n  sh.setRowHeight(1, 44);\n\n  // live summary\n  sh.getRange(2, 1, 1, NC).merge().setBackground('#eef3fb').setFontColor(NAVY).setFontWeight('bold')\n    .setHorizontalAlignment('left').setVerticalAlignment('middle');\n  sh.getRange(2, 1).setFormula('=\"Registered: \"&COUNTIF($I$4:$I,\"Booked\")&\"      Present: \"&COUNTIF($H$4:$H,\"Present\")&\"      Absent: \"&COUNTIF($H$4:$H,\"Absent\")&\"      Cancelled: \"&COUNTIF($I$4:$I,\"Cancelled\")');\n  sh.setRowHeight(2, 30);\n\n  // header\n  sh.getRange(HEAD, 1, 1, NC).setValues([HEADERS]).setBackground(BLUE).setFontColor('#ffffff').setFontWeight('bold')\n    .setHorizontalAlignment('center').setVerticalAlignment('middle');\n  sh.setRowHeight(HEAD, 32);\n\n  // columns\n  [50, 190, 230, 130, 160, 95, 95, 110, 100, 175, 230, 220, 120].forE ete whole blocks of neighbouring rows, from the bottom up\n    var end = rows[i], start = end;\n    while (i + 1 < rows.length && rows[i + 1] === start - 1) { i++; start = rows[i]; }\n    sh.deleteRows(start, end - start + 1); i++;\n  }\n  if (sh.getMaxRows() < MAXROWS) { sh.insertRowsAfter(sh.getMaxRows(), MAXROWS - sh.getMaxRows()); formatMain_(sh); }\n  finalize_(sh);\n  return rows.length;\n}\nfunction menuAllowMonth() {\n  var ui = SpreadsheetApp.getUi(), d = deleted_(), keys = Object.keys(d).sort();\n  if (!keys.length) { ui.alert('No month has been deleted.'); return; }\n  var r = ui.prompt('Allow a deleted month again', 'Deleted months: ' + keys.join(', ') + '\\n\\nType the month (YYYY-MM) that may be saved to the sheet again. After that, press \"Sync all data now\" in the Admin Panel \\u2192 Google Sheet.', ui.ButtonSet.OK_CANCEL);\n  if (r.getSelectedButton() !== ui.Button.OK) return;\n  var m = String(r.getResponseText() || '').trim();\n  if (!d[m]) { ui.alert('That month is not in the list.'); return; }\n  delete d[m]; setDeleted_(d); ui.alert('Done', monthName_(m) + ' can be saved to the sheet again.', ui.ButtonSet.OK);\n}\nfunction menuMigrate() {\n  var ui = SpreadsheetApp.getUi(), ss = SpreadsheetApp.getActiveSpreadsheet(), lock = LockService.getScriptLock();\n  lock.waitLock(30000);\n  try {\n    var n = migrateOld_(ss, mainSheet_(ss));\n    ui.alert('Done', 'Old date tabs merged into \"' + MAIN_TAB + '\". Rows moved: ' + n + '.', ui.ButtonSet.OK);\n  } finally { try { lock.releaseLock(); } catch (x) { /* not locked */ } }\n}\n\n/* ============================ RENTALS (added) ============================\n * Rental bookings -> one tab per space (\"Rent \u2013 Mentor Hall\", ...) in the SAME spreadsheet.\n * Current rates / availability -> tab \"Rental Rates\"; every change is logged in \"Rental Changes\".\n * Like the exam tabs: nothing is ever deleted (cancelled / deleted bookings stay, marked Cancelled).\n */\nvar RENT_HEAD = 3, RENT_FIRST = 4;\nv function sheetRecs(bIds, dIds, goneIds) {
  const bm = new Map(bookings.map(b => [b.id, b])), dm = new Map(dates.map(d => [d.id, d]));
  const gone = new Set(goneIds || []), rec = { bookings: {}, dates: {} }, dd = new Set(dIds);
  bIds.forEach(id => {
    const b = bm.get(id);
    if (!b) { gone.add(id); return; }
    if (gone.has(id)) return;
    rec.bookings[id] = { name: b.name, email: b.email, phone: b.phone, dateId: b.dateId, date: b.date, time: b.time, endTime: b.endTime || null, createdAt: b.createdAt, attended: b.attended === undefined ? null : b.attended, examTitle: b.examTitle || '' };

function sheetQueue(o) {

async function sheetSyncAll(onMsg, only) {
  const dIds = only ? only.dates : dates.map(d => d.id), bIds = only ? only.bookings : bookings.map(b => b.id);
  const total = dIds.length + bIds.length; let done = 0;
  const step = async (key, ids) => {
    for (let i = 0; i < ids.length; i += 40) {
      const chunk = ids.slice(i, i + 40);
      const r = await sheetCall(sheetCfg.url, { action: 'sync', [key]: chunk, token: await sheetTok(), ...sheetRecs(key === 'bookingIds' ? chunk : [], key === 'dateIds' ? chunk : [], []) });
      if (!r || !r.ok) throw sheetFail(r);
      if (r.warn) sheetLastWarn = r.warn;
      done += chunk.length; if (onMsg) onMsg('Syncing… ' + done + ' / ' + total);
    }

}

        await commitOps(ops);
        toast(removable.length
          ? 'Repeat is OFF – ' + removable.length + ' upcoming weekly date' + (removable.length > 1 ? 's' : '') + ' with no registrations removed' + (keep.length ? '; dates that already have registrations, or have already happened, were kept' : '')
          : 'Repeat is OFF – no dates were removed. Dates already created stay (delete any you do not need one by one).', 'ok');
      }
      setTimeout(rerenderPanel, 150);
    });
  },
  async delDate(d, el) {
    const cur = dates.find(x => x.id === d.id), n = regsOfDate(cur.id).length;
    if (!await confirmBox(`Delete <b>${fmtDate(cur.date)}</b> with all its time slots${n ? ` and <b>${n} student registration${n > 1 ? 's' : ''}</b>` : ''}? This cannot be undone.`, { okText: 'Delete', danger: true })) return;
    return run(el, async () => {
      const ops = [...regsOfDate(cur.id).map(b => ({ t: 'del', ref: db.collection('bookings').doc(b.id) })),
        ...slotsOf(cur.id).map(s => ({ t: 'del', ref: db.collection('slots').doc(s.id) })), { t: 'del', ref: db.collection('examDates').doc(cur.id) }];
      await commitOps(ops);
      if (activePanel) activePanel.m.close();
      toast('Exam date deleted', 'ok'); computeStorage();
    });
  },
  addSlot(d, el) {
    return run(el, async () => {
      const dt = dates.find(x => x.id === d.id);
      const time = $('#sTime').value, end = $('#sEnd').value, capV = $('#sCap').value.trim();
      if (!time) throw new Error('Enter a start time.');
      if (end && end <= time) throw new Error('End time must be after start time.');
      let cap = null; if (capV !== '') { cap = parseInt(capV, 10); if (isNaN(cap) || cap < 1) throw new Error('Seat limit must be 1 or more.'); }
      if (slotsOf(dt.id).some(s => s.time === time)) throw new Error('A slot with this start time already exists.');
      await db.collection('slots').add({ dateId: dt.id, date: dt.date, time, endTime: end || null, capacity: cap, booked: 0, createdAt: Date.now() });
      toast('Slot added', 'ok'); setTimeout(rerenderPanel, 150);
    });
  },
  editSlot(d) {
    const s = slots.find(x => x.id === d.id); if (!s) return;
    const m = modal(`<h2 class="mh">Edit time slot</h2><p class="msub">${fmtDate(s.date)} · ${regsOfSlot(s.id).length} registered</p>
      <div class="row2"><div class="field"><label>Start time</label><input id="esTime" type="time" value="${s.time}"/></div><div class="field"><label>End time</label><input id="esEnd" type="time" value="${s.endTime || ''}"/></div></div>
      <div class="field"><label>Seat limit (empty = no limit)</label><input id="esCap" type="number" min="1" value="${s.capacity == null ? '' : s.capacity}"/></div>
      <div class="err" id="esErr"></div><button class="btn btn-blue btn-block" id="esBtn">Save slot</button>`);
    m.$('#esBtn').onclick = () => run(m.$('#esBtn'), async () => {
      const time = m.$('#esTime').value, end = m.$('#esEnd').value, capV = m.$('#esCap').value.trim();
      if (!time) { m.$('#esErr').textContent = 'Enter a start time.'; return; }
      if (end && end <= time) { m.$('#esErr').textContent = 'End time must be after start time.'; return; }
      let cap = null; if (capV !== '') { cap = parseInt(capV, 10); if (isNaN(cap) || cap < 1) { m.$('#esErr').textContent = 'Invalid seat limit.'; return; } }
      const booked = regsOfSlot(s.id).length;
      if (cap != null && cap < booked) { m.$('#esErr').textContent = `Seat limit cannot be less than the ${booked} already registered.`; return; }
      if (slotsOf(s.dateId).some(x => x.id !== s.id && x.time === time)) { m.$('#esErr').textContent = 'Another slot has this start time.'; return; }
      const ops = [{ t: 'upd', ref: db.collection('slots').doc(s.id), data: { time, endTime: end || null, capacity: cap } }];
      regsOfSlot(s.id).forEach(b => ops.push({ t: 'upd', ref: db.collection('bookings').doc(b.id), data: { time, endTime: end || null } }));
      await commitOps(ops); sheetQueue({ bookings: regsOfSlot(s.id).map(b => b.id) }); m.close(); toast('Slot updated', 'ok'); setTimeout(rerenderPanel, 150);
    });
  },
  async delSlot(d, el) {
    const s = slots.find(x => x.id === d.id), n = regsOfSlot(d.id).length;
    if (!await confirmBox(`Delete the <b>${slotLabel(s)}</b> slot${n ? ` and its <b>${n} registration${n > 1 ? 's' : ''}</b>` : ''}?`, { okText: 'Delete', danger: true })) return;
    return run(el, async () => {
      const gone = regsOfSlot(s.id).map(b => b.id);
      await commitOps([...regsOfSlot(s.id).map(b => ({ t: 'del', ref: db.collection('bookings').doc(b.id) })), { t: 'del', ref: db.collection('slots').doc(s.id) }]);
      sheetQueue({ bookings: gone, gone });
      toast('Slot deleted', 'ok'); setTimeout(rerenderPanel, 150); computeStorage();
    });
  },

  /* registrations */
  regMore() { regF.limit += 100; views.registrations.refresh(); },
  regCsv() {
    const list = regFiltered();
    const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
    const csv = ['Name,Email,Phone,Exam date,Start time,End time,Attendance,Registered at'].concat(list.map(b =>
      [b.name, b.email, "'" + b.phone, b.date, b.time, b.endTime || '', b.attended === true ? 'Present' : b.attended === false ? 'Absent' : 'Not marked', new Date(b.createdAt || 0).toLocaleString('en-GB')].map(q).join(','))).join('\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv' })); a.download = 'registrations.csv'; a.click();
  },
  regEdit(d) {
    const b = bookings.find(x => x.id === d.id); if (!b) return;
    const now = Date.now();
    const opts = dates.slice().sort((x, y) => x.date.localeCompare(y.date)).map(dt => slotsOf(dt.id).map(s => {
      const si = seatInfo(s), isCur = s.id === b.slotId;
      const dis = !isCur && (si.full || now >= slotStart(s));
      return `<option value="${s.id}" ${isCur ? 'selected' : ''} ${dis ? 'disabled' : ''}>${fmtDate(dt.date, true)} · ${slotLabel(s)} ${si.unlimited ? '' : '(' + si.text + ')'}</option>`;
    }).join('')).join('');
    const m = modal(`<h2 class="mh">Edit registration</h2><p class="msub">Booking code: <code style="font-size:11px">${b.id}</code></p>
      <div class="field"><label>Name</label><input id="reName" value="${esc(b.name)}"/></div>
      <div class="row2"><div class="field"><label>Email</label><input id="reEmail" value="${esc(b.email)}"/></div><div class="field"><label>Phone</label><input id="rePhone" value="${esc(b.phone)}"/></div></div>
      <div class="field"><label>Exam slot</label><select id="reSlot">${opts}</select></div>
      <div class="err" id="reErr"></div><button class="btn btn-blue btn-block" id="reBtn">Save changes</button>`);
    m.$('#reBtn').onclick = () => run(m.$('#reBtn'), async () => {
      const name = m.$('#reName').value.trim(), email = m.$('#reEmail').value.trim(), phone = m.$('#rePhone').value.trim(), ns = m.$('#reSlot').value;
      if (name.length < 2 || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) || phone.length < 7) { m.$('#reErr').textContent = 'Please enter a valid name, email and phone.'; return; }
      if (ns === b.slotId) { await db.collection('bookings').doc(b.id).update({ name, email, phone }); }
      else {
        const nsl = slots.find(x => x.id === ns), ndt = dates.find(x => x.id === nsl.dateId);
        await db.runTransaction(async tx => {
          const oRef = db.collection('slots').doc(b.slotId), nRef = db.collection('slots').doc(ns);
          const o = await tx.get(oRef), n = await tx.get(nRef);
          if (!n.exists) throw new Error('Target slot no longer exists.');
          const nd = n.data();
          if (nd.capacity != null && (nd.booked || 0) >= nd.capacity) throw new Error('Target slot is full.');
          if (o.exists) tx.update(oRef, { booked: Math.max(0, (o.data().booked || 0) - 1) });
          tx.update(nRef, { booked: (nd.booked || 0) + 1 });
          tx.update(db.collection('bookings').doc(b.id), { name, email, phone, slotId: ns, dateId: nsl.dateId, date: nsl.date, time: nsl.time, endTime: nsl.endTime || null, examTitle: (ndt && ndt.title) || 'PTE Simulation Exam' });
        });
      }
      sheetQueue({ bookings: [b.id] });
      m.close(); toast('Registration updated', 'ok');
    });
  },
  async regDel(d, el) {
    const b = bookings.find(x => x.id === d.id); if (!b) return;
    if (!await confirmBox(`Delete the registration of <b>${esc(b.name)}</b> (${fmtDate(b.date, true)}, ${slotLabel(b)})? The seat will be freed.`, { okText: 'Delete', danger: true })) return;
    return run(el, async () => {
      await db.runTransaction(async tx => {
        const sRef = db.collection('slots').doc(b.slotId); const s = await tx.get(sRef);
        if (s.exists) tx.update(sRef, { booked: Math.max(0, (s.data().booked || 0) - 1) });
        tx.delete(db.collection('bookings').doc(b.id));
      });
      sheetQueue({ bookings: [b.id], gone: [b.id] });
      toast('Registration deleted', 'ok'); computeStorage();
    });
  },

  /* attendance */
  att(d) {
    const b = bookings.find(x => x.id === d.id); if (!b) return;
    const want = d.val === 'p' ? true : false;
    const nv = b.attended === want ? null : want;
    // attendedAt stamps the moment the fee is counted as income (Income report) – cleared if attendance is un-marked
    db.collection('bookings').doc(b.id).update({ attended: nv, attendedAt: nv === true ? Date.now() : null }).then(() => sheetQueue({ bookings: [b.id] })).catch(e => toast(errMsg(e), 'err'));
  },
  attAll(d, el) {
    return run(el, async () => {
      const v = d.val === '1' ? true : null;
      await commitOps(regsOfSlot(d.slot).map(b => ({ t: 'upd', ref: db.collection('bookings').doc(b.id), data: { attended: v, attendedAt: v === true ? Date.now() : null } })));
      sheetQueue({ bookings: regsOfSlot(d.slot).map(b => b.id) });
      toast(v ? 'All marked present' : 'Cleared', 'ok');
    });
  },

  /* reports */
  repPdf() { if (!repMonth) { toast('Select a month', 'err'); return; } downloadReportPDF(repMonth); },

  /* google sheet */
  async sheetCopy() {
    const t = $('#shCode');
    try { await navigator.clipboard.writeText(t.value); } catch (e) { t.select(); document.execCommand('copy'); }
    toast('Code copied', 'ok');
  },
  sheetConnect(d, el) {
    return run(el, async () => {
      const url = $('#shUrl').value.trim(), msg = $('#shMsg');
      if (!SHEET_URL_RE.test(url)) throw new Error('Paste the Web app URL that ends with /exec');
      msg.textContent = 'Connecting…';
      let r;
      try { r = await sheetCall(url, { action: 'setup' }, 60000); }
      catch (e) { e.code = 'E_NETWORK'; return sheetShowErr(e); }
      if (!r || !r.ok) return sheetShowErr(sheetFail(r));
      await db.collection('settings').doc('site').set({ sheetUrl: url, sheetOn: true, sheetUpdatedAt: Date.now() }, { merge: true });
      sheetCfg = { url, on: true }; sheetHealed = true;
      try { await sheetSyncAll(t => { msg.textContent = t; }); }
      catch (e) { views.sheet.paint(''); return sheetShowErr(e); }
      views.sheet.paint('✓ Connected to <b>' + esc(r.name) + '</b> – <a href="' + esc(r.url) + '" target="_blank" rel="noopener">open the sheet</a>. New bookings now save automatically.');
      toast('Google Sheet connected', 'ok');
    });
  },
  sheetTest(d, el) {
    return run(el, async () => {
      let r; try { r = await sheetCall(sheetCfg.url, { action: 'ping' }, 30000); } catch (e) { e.code = 'E_NETWORK'; return sheetShowErr(e); }
      if (!r || !r.ok) return sheetShowErr(sheetFail(r));
      $('#shMsg').innerHTML = '✓ Working – sheet “' + esc(r.name) + '” · <a href="' + esc(r.url) + '" target="_blank" rel="noopener">open the sheet</a>';
    });
  },
  sheetSync(d, el) {
    return run(el, async () => {
      const msg = $('#shMsg');
      try {
        sheetLastWarn = '';
        const n = await sheetSyncAll(t => { msg.textContent = t; });
        msg.textContent = '✓ Done – ' + n + ' record' + (n === 1 ? '' : 's') + ' checked / updated.' + (sheetLastWarn ? ' (Firestore blocked the script’s direct read [' + sheetLastWarn + '], so the data was sent from this page instead – it is saved correctly.)' : '');
      } catch (e) { sheetShowErr(e); }
    });
  },
  sheetToggle(d, el) {
    return run(el, async () => {
      const on = !sheetCfg.on;
      await db.collection('settings').doc('site').set({ sheetOn: on, sheetUpdatedAt: Date.now() }, { merge: true });
      sheetCfg.on = on; views.sheet.paint(on ? 'Auto-sync resumed. Press "Sync all data now" to add anything saved while it was paused.' : 'Auto-sync paused. Nothing is removed from the sheet.');
    });
  },

  /* content */
  contentSave(d, el) {
    return run(el, async () => {
      const price = Math.round(Number($('#ctPrice').value)) || 0;
      const data = { heroTitle: $('#ctHero').value.trim(), welcomeMsg: $('#ctWelcome').value.trim(), announcement: $('#ctAnn').value.trim(), examPrice: price >= 0 ? price : 0, description: $('#ctDesc').value.trim(), rules: $('#ctRules').value.trim(), contact: $('#ctContact').value.trim(), updatedAt: Date.now() };
      await db.collection('settings').doc('site').set(data, { merge: true }); siteData = { ...siteData, ...data };
      toast('Website content saved', 'ok'); computeStorage();
    });
  },
  photoPick() { $('#photoIn').click(); },
  async photoDel(d, el) {
    if (!await confirmBox('Delete this photo?', { okText: 'Delete', danger: true })) return;
    return run(el, async () => { await db.collection('gallery').doc(d.id).delete(); galDocs = galDocs.filter(g => g.id !== d.id); views.content.paint(); toast('Photo deleted', 'ok'); computeStorage(); });
  },

  /* storage */
  stCalc(d, el) { return run(el, async () => { await computeStorage(); toast('Recalculated', 'ok'); }); },
  stLimit() { const v = Number($('#stLimit').value); if (!v || v < 50) { toast('Enter a valid size in MB', 'err'); return; } localStorage.setItem('mb_limit_mb', v); computeStorage(); },
  stDelete() {
    const tg = cleanupTargets();
    const m = modal(`<h2 class="mh">Delete ${stEarlier ? 'data up to ' : 'data of '}${monthLabel(stMonth)}</h2>
      <p class="msub">This will permanently delete <b>${tg.ds.length}</b> exam date(s), <b>${tg.sl.length}</b> slot(s) and <b>${tg.bk.length}</b> registration(s) and <b>${tg.rb.length}</b> rental booking(s). Admin accounts and website settings stay.</p>
      ${can('reports') && !stEarlier ? '<button class="btn btn-ghost btn-sm" id="dlRep" style="margin-bottom:14px">⬇ Download this month\'s PDF report first</button>' : ''}
      <div class="field"><label>Enter your admin password to confirm</label><input id="delPw" type="password" autocomplete="current-password"/></div>
      <div class="err" id="delErr"></div>
      <button class="btn btn-primary btn-block" id="delGo">🗑 Delete permanently</button>`);
    const dl = m.$('#dlRep'); if (dl) dl.onclick = () => downloadReportPDF(stMonth);
    m.$('#delGo').onclick = async () => {
      const pw = m.$('#delPw').value; if (!pw) { m.$('#delErr').textContent = 'Password required.'; return; }
      const b = m.$('#delGo'); b.disabled = true; b.innerHTML = '<span class="spin"></span> Deleting...';
      try {
        await user.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(user.email, pw));
        const t2 = cleanupTargets();
        await commitOps([...t2.bk.map(x => ({ t: 'del', ref: db.collection('bookings').doc(x.id) })), ...t2.rb.map(x => ({ t: 'del', ref: db.collection('rentBookings').doc(x.id) })), ...t2.rb.map(x => ({ t: 'del', ref: db.collection('rentSlips').doc(x.id) })), ...t2.rb.map(x => ({ t: 'del', ref: db.collection('rentSlips').doc(x.id + '_bal') })), ...t2.sl.map(x => ({ t: 'del', ref: db.collection('slots').doc(x.id) })), ...t2.ds.map(x => ({ t: 'del', ref: db.collection('examDates').doc(x.id) }))]);
        m.close(); toast('Old data deleted – storage freed', 'ok'); setTimeout(computeStorage, 800);
      } catch (e) { m.$('#delErr').textContent = authErr(e); b.disabled = false; b.textContent = '🗑 Delete permanently'; }
    };
  },

  /* admins */
  adminAdd() {
    const m = modal(`<h2 class="mh">Add admin</h2><p class="msub">Create a login and choose what this person can access.</p>
      <div class="field"><label>Name</label><input id="aaName"/></div>
      <div class="row2"><div class="field"><label>Email</label><input id="aaEmail" type="email"/></div><div class="field"><label>Password (min 6)</label><input id="aaPw" type="text" autocomplete="off"/></div></div>
      <div class="field"><label>Role</label><select id="aaRole"><option value="admin">Admin (choose permissions)</option><option value="super">Super admin (full access incl. admins)</option></select></div>
      <div id="aaPerms"><label style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase">Permissions</label>${permBoxes({ dates: true, bookings: true, attendance: true })}</div>
      <div class="err" id="aaErr"></div><button class="btn btn-primary btn-block" id="aaBtn">Create admin</button>`);
    m.$('#aaRole').onchange = e => { m.$('#aaPerms').hidden = e.target.value === 'super'; };
    m.$('#aaBtn').onclick = () => run(m.$('#aaBtn'), async () => {
      const name = m.$('#aaName').value.trim(), email = m.$('#aaEmail').value.trim(), pw = m.$('#aaPw').value, role = m.$('#aaRole').value;
      if (!name || !email || pw.length < 6) { m.$('#aaErr').textContent = 'Fill name, email and a password of 6+ characters.'; return; }
      try {
        const uid = await createAuthUser(email, pw);
        await db.collection('admins').doc(uid).set({ name, email, role, founder: false, perms: role === 'super' ? ALLPERMS : readPerms(m.el), createdAt: Date.now(), createdBy: me.id });
        m.close(); toast('Admin created', 'ok'); views.admins.load();
      } catch (e) { m.$('#aaErr').textContent = authErr(e); }
    });
  },
  adminEdit(d) {
    const a = adminList.find(x => x.id === d.id); if (!a) return;
    const lock = a.founder || a.id === me.id;
    const m = modal(`<h2 class="mh">Edit admin</h2><p class="msub">${esc(a.email || '')}</p>
      <div class="field"><label>Name</label><input id="aeName" value="${esc(a.name || '')}"/></div>
      <div class="field"><label>Role</label><select id="aeRole" ${lock ? 'disabled' : ''}><option value="admin" ${a.role !== 'super' ? 'selected' : ''}>Admin</option><option value="super" ${a.role === 'super' ? 'selected' : ''}>Super admin</option></select></div>
      <div id="aePerms" ${a.role === 'super' ? 'hidden' : ''}><label style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase">Permissions</label>${permBoxes(a.perms || {})}</div>
      <div class="err" id="aeErr"></div><button class="btn btn-blue btn-block" id="aeBtn">Save</button>`);
    m.$('#aeRole').onchange = e => { m.$('#aePerms').hidden = e.target.value === 'super'; };
    m.$('#aeBtn').onclick = () => run(m.$('#aeBtn'), async () => {
      const role = lock ? a.role : m.$('#aeRole').value;
      await db.collection('admins').doc(a.id).update({ name: m.$('#aeName').value.trim(), role, perms: role === 'super' ? ALLPERMS : readPerms(m.el) });
      m.close(); toast('Admin updated', 'ok'); views.admins.load();
    });
  },
  async adminDel(d) {
    const a = adminList.find(x => x.id === d.id); if (!a || a.id === me.id) return;
    if (a.founder) {
      const m = modal(`<h2 class="mh">Delete founder account</h2><p class="msub">Enter the <b>master delete password</b> that was set during first-time setup.</p>
        <div class="field"><input id="mpIn" type="password" autocomplete="off"/></div><div class="err" id="mpErr"></div>
        <button class="btn btn-primary btn-block" id="mpBtn">Verify & delete</button>`);
      m.$('#mpBtn').onclick = () => run(m.$('#mpBtn'), async () => {
        const s = await db.collection('secure').doc('master').get();
        if (!s.exists) { m.$('#mpErr').textContent = 'Master password record not found.'; return; }
        const h = await sha256(s.data().salt + m.$('#mpIn').value);
        if (h !== s.data().hash) { m.$('#mpErr').textContent = 'Wrong master password.'; return; }
        await db.collection('admins').doc(a.id).delete(); m.close(); toast('Founder deleted', 'ok'); views.admins.load();
      });
      return;
    }
    if (!await confirmBox(`Delete admin <b>${esc(a.name || a.email)}</b>? They will lose all access immediately.`, { okText: 'Delete', danger: true })) return;
    try { await db.collection('admins').doc(a.id).delete(); toast('Admin deleted', 'ok'); views.admins.load(); } catch (e) { toast(errMsg(e), 'err'); }
  }
};
const C = {
  rgDate(el) { regF.date = el.value; regF.limit = 100; views.registrations.refresh(); },
  atDate(el) { attF.date = el.value; views.attendance.refresh(); },
  repM(el) { repMonth = el.value; views.reports.refresh(); },
  stMonth(el) { stMonth = el.value; views.storage.refresh(); },
  stEarlier(el) { stEarlier = el.checked; views.storage.refresh(); },
  photoCap(el) { db.collection('gallery').doc(el.dataset.id).update({ caption: el.value.trim() }).then(() => toast('Caption saved', 'ok')).catch(e => toast(errMsg(e), 'err')); }
};
const I = {
  rgQ(el) { regF.q = el.value; regF.limit = 100; views.registrations.refresh(); },
  atQ(el) { attF.q = el.value; views.attendance.refresh(); }
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (t && A[t.dataset.act]) { e.preventDefault(); A[t.dataset.act](t.dataset, t, e); }
});
document.addEventListener('change', e => { const t = e.target.closest('[data-chg]'); if (t && C[t.dataset.chg]) C[t.dataset.chg](t); });
document.addEventListener('input', e => { const t = e.target.closest('[data-inp]'); if (t && I[t.dataset.inp]) I[t.dataset.inp](t); });

boot();
</script>
<script src="rent-data.js"></script>
<script src="admin-rentals.js"></script>
<script src="admin-mock.js"></script>
<script src="admin-errors.js"></script>
<script src="admin-finance.js"></script>
</body>
